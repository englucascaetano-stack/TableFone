# Publica a pasta public/ no GitHub Pages. A URL e a chave do Supabase vem das Variaveis do
# repositorio (Settings > Secrets and variables > Actions > Variables), nao do codigo.
name: Publicar telas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionar arquivos (evita estilo/codigo antigo guardado no celular)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(style\.css|config\.js|transport\.js|rules\.js|ui-kit\.js|motion\.js|app\.js|vendor/supabase\.js)\"#\1=\"\2?v=$V\"#g" public/index.html
          grep -c "?v=$V" public/index.html
          echo "ASSET_VERSION=$V" >> "$GITHUB_ENV"
      - name: Gerar config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          SUPABASE_REGION: us-east-1  # regiao do banco (nao e segredo)
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "Defina as Variaveis SUPABASE_URL e SUPABASE_KEY"; exit 1; }
          node -e "require('fs').writeFileSync('public/config.js','window.MESA_CONFIG = '+JSON.stringify({supabaseUrl:process.env.SUPABASE_URL,supabaseKey:process.env.SUPABASE_KEY,supabaseRegion:process.env.SUPABASE_REGION||'',assetVersion:process.env.ASSET_VERSION||''})+';\n')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
